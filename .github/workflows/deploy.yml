name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verificar-secretos:
    name: verificar-secretos
    runs-on: ubuntu-latest
    steps:
      - name: Secrets de GitHub requeridos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          faltantes=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || faltantes="$faltantes CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || faltantes="$faltantes CLOUDFLARE_ACCOUNT_ID"
          [ -n "$RENDER_DEPLOY_HOOK" ] || faltantes="$faltantes RENDER_DEPLOY_HOOK"
          if [ -n "$faltantes" ]; then
            echo "::error::Faltan secrets de deploy:$faltantes. El deploy se aborta (no se publica verde)."
            exit 1
          fi
          echo "Secrets de deploy presentes; se verifica el health del backend tras publicar."

  frontend:
    name: Deploy frontend (Cloudflare Worker)
    needs: verificar-secretos
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Deploy Worker (SW_VERSION derivado del commit)
        id: deploy-worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
          vars: |
            SW_VERSION
          workingDirectory: .
        env:
          SW_VERSION: ${{ github.sha }}
      - name: Verificar SW_VERSION publicado
        env:
          WORKER_URL: https://magnetixdian.hbarbetti-ing.workers.dev
          SW_VERSION: ${{ github.sha }}
        run: |
          for i in $(seq 1 12); do
            sw=$(curl -fsS -m 30 "$WORKER_URL/sw.js" 2>/dev/null || true)
            case "$sw" in
              *"magnetixdian-$SW_VERSION"*)
                echo "SW_VERSION publicado: $SW_VERSION"
                exit 0
                ;;
            esac
            echo "Intento $i: SW_VERSION aún no visible; reintentando en 10s..."
            sleep 10
          done
          echo "::error::El Worker no publicó SW_VERSION=$SW_VERSION en /sw.js."
          exit 1

  backend:
    name: Deploy backend (Render)
    needs: verificar-secretos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      BACKEND_URL: https://magnetixdian-backend.onrender.com
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
      - name: Esperar a que el backend esté saludable
        run: |
          echo "Esperando a $BACKEND_URL/actuator/health ..."
          for i in $(seq 1 40); do
            respuesta=$(curl -fsS -m 30 "$BACKEND_URL/actuator/health" 2>/dev/null || true)
            case "$respuesta" in
              *'"status":"UP"'*)
                echo "Backend saludable (intento $i)."
                exit 0
                ;;
            esac
            echo "Intento $i: backend no saludable; reintentando en 20s..."
            sleep 20
          done
          echo "::error::El backend no respondió UP a tiempo. Render debe tener SEGURIDAD_FAIL_FAST=true y todos los secretos configurados."
          exit 1
