name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  frontend:
    name: Deploy frontend (Cloudflare Worker)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          version: 12
      - uses: actions/setup-node@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Deploy Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: .
      - name: Aviso (secrets no configurados)
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN no configurado; se omite el deploy del frontend."

  backend:
    name: Deploy backend (Render)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      BACKEND_URL: https://magnetixdian-backend.onrender.com
    steps:
      - name: Trigger Render deploy
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
      - name: Esperar a que el backend esté saludable
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: |
          echo "Esperando a $BACKEND_URL/actuator/health ..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$BACKEND_URL/actuator/health" || true)
            if [ "$code" = "200" ]; then
              echo "Backend saludable (intento $i):"
              curl -s "$BACKEND_URL/actuator/health"
              exit 0
            fi
            echo "Intento $i: HTTP $code; reintentando en 20s..."
            sleep 20
          done
          echo "::error::El backend no respondió saludablemente a tiempo."
          exit 1
      - name: Aviso (secrets no configurados)
        if: ${{ env.RENDER_DEPLOY_HOOK == '' }}
        run: echo "::notice::RENDER_DEPLOY_HOOK no configurado; el backend no se desplegará."
