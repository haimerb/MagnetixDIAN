name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build + tests
        run: mvn -q clean package -Dfile.encoding=UTF-8

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: magnetixdian
          POSTGRES_USER: magnetixdian
          POSTGRES_PASSWORD: magnetixdian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magnetixdian"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/magnetixdian?characterEncoding=UTF-8
      DB_USER: magnetixdian
      DB_PASSWORD: magnetixdian
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build backend
        working-directory: backend
        run: mvn -q -DskipTests package -Dfile.encoding=UTF-8
      - name: Start backend
        working-directory: backend
        run: |
          nohup java -jar target/magnetixdian-backend-*.jar > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend listo"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/backend.log
          exit 1
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Build and start preview
        working-directory: frontend
        run: |
          pnpm run build
          nohup pnpm run preview -- --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 > /dev/null; then
              echo "Preview listo"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/preview.log
          exit 1
      - name: Run E2E
        working-directory: frontend
        run: pnpm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
