name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build + tests
        run: mvn -q clean package -Dfile.encoding=UTF-8

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: ESLint (0 warnings)
        run: pnpm run lint -- --max-warnings=0
      - name: Unit tests (Vitest)
        run: pnpm run test
      - run: pnpm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: magnetixdian
          POSTGRES_USER: magnetixdian
          POSTGRES_PASSWORD: magnetixdian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magnetixdian"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/magnetixdian?characterEncoding=UTF-8
      DB_USER: magnetixdian
      DB_PASSWORD: magnetixdian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build backend
        working-directory: backend
        run: mvn -q -DskipTests package -Dfile.encoding=UTF-8
      - name: Start backend
        working-directory: backend
        run: |
          nohup java -jar target/magnetixdian-backend-*.jar > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend listo"
              exit 0
            fi
            sleep 2
          done
          echo "::error::El backend no arrancó; revisar el log de la ejecución."
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Build and start preview
        working-directory: frontend
        run: |
          pnpm run build
          nohup pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173 > /dev/null; then
              echo "Preview listo"
              exit 0
            fi
            sleep 2
          done
          echo "::error::El preview del frontend no arrancó."
          exit 1
      - name: Run E2E
        working-directory: frontend
        run: pnpm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  seguridad:
    name: seguridad
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git diff --check
        working-directory: .
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD^)"; fi
          git diff --check "$base" HEAD

      - name: Gitleaks (salida redactada)
        working-directory: .
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            detect --source . --redact --no-banner --log-level error

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build de seguridad (fail-fast dev + tests)
        run: mvn -q clean package -Dfile.encoding=UTF-8

  required-checks:
    name: required-checks
    if: always()
    needs: [backend, frontend, e2e, seguridad]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar checks requeridos
        env:
          RESULTADOS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "$RESULTADOS" | tr ',' '\n' | while read -r resultado; do
            if [ "$resultado" != "success" ]; then
              echo "::error::Check requerido en estado: $resultado"
              exit 1
            fi
          done
