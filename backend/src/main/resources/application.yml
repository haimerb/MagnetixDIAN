spring:
  application:
    name: magnetixdian-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/magnetixdian?characterEncoding=UTF-8}
    username: ${DB_USER:magnetixdian}
    password: ${DB_PASSWORD:magnetixdian}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    time-zone: America/Bogota
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

# Los valores por defecto de esta sección son SOLO para desarrollo local.
# Con SEGURIDAD_FAIL_FAST=true (Render) la app no arranca si faltan los secretos
# o si se detecta alguno de estos valores de ejemplo. Ver SecurityConfig.
magnetixdian:
  jwt:
    secret: ${JWT_SECRET:bWFnbmV0aXhkaWFuLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLTIwMjYtcGt6ZDEyM2ZiYQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  app:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  auth:
    expose-token: ${AUTH_EXPOSE_TOKEN:true}
  transmision:
    reintento-ms: ${REINTENTO_TRANSMISION_MS:60000}
  pac:
    connect-timeout-ms: ${PAC_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${PAC_READ_TIMEOUT_MS:30000}
  dian:
    url-habilitacion: ${DIAN_URL_HABILITACION:https://vpfe-hab.dian.gov.co/WcfDianCustomerServices.svc}
    url-produccion: ${DIAN_URL_PRODUCCION:https://vpfe.dian.gov.co/WcfDianCustomerServices.svc}
    connect-timeout-ms: ${DIAN_CONNECT_TIMEOUT_MS:30000}
    request-timeout-ms: ${DIAN_REQUEST_TIMEOUT_MS:60000}
    wsdl:
      version: ${DIAN_WSDL_VERSION:2.1}
      url-oficial: ${DIAN_WSDL_URL_OFICIAL:}
    catalogo:
      base-url: ${DIAN_CATALOGO_BASE_URL:https://catalogo-vpfe.dian.gov.co}
      token-url: ${DIAN_CATALOGO_TOKEN_URL:}
      listado-url: ${DIAN_CATALOGO_LISTADO_URL:}
      hosts-permitidos: ${DIAN_CATALOGO_HOSTS_PERMITIDOS:catalogo-vpfe.dian.gov.co,vpfe.dian.gov.co,vpfe-hab.dian.gov.co}
      connect-timeout-ms: ${DIAN_CATALOGO_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${DIAN_CATALOGO_READ_TIMEOUT_MS:60000}
      max-bytes: ${DIAN_CATALOGO_MAX_BYTES:52428800}
  radian:
    aceptacion-tacita: ${RADIAN_ACEPTACION_TACITA:false}
    aceptacion-tacita-cron: ${RADIAN_ACEPTACION_TACITA_CRON:0 0 6 * * *}
  pagos:
    webhook-tolerance-seconds: ${PAGOS_WEBHOOK_TOLERANCE_SECONDS:300}
    exigir-firma-webhook: ${PAGOS_EXIGIR_FIRMA_WEBHOOK:false}
    wompi:
      public-key: ${WOMPI_PUBLIC_KEY:}
      integrity-secret: ${WOMPI_INTEGRITY_SECRET:}
      events-secret: ${WOMPI_EVENTS_SECRET:}
      checkout-url: ${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}
      api-token: ${WOMPI_API_TOKEN:}
      api-url: ${WOMPI_API_URL:https://api.wompi.co}
    mercadopago:
      access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
      base-url: ${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
      back-url: ${MERCADOPAGO_BACK_URL:}
      webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  crypto:
    key: ${CRYPTO_KEY:magnetixdian-dev-crypto-key-change-me}
    key-id: ${CRYPTO_KEY_ID:primary}
    extra-keys: ${CRYPTO_EXTRA_KEYS:}
  seguridad:
    fail-fast: ${SEGURIDAD_FAIL_FAST:false}
    tenant-filter-enabled: ${TENANT_FILTER_ENABLED:false}
  whatsapp:
    base-url: ${WHATSAPP_BASE_URL:https://wa.me}
    default-template: ${WHATSAPP_DEFAULT_TEMPLATE:Hola, le compartimos su factura {numero} por un total de {total}. ¡Gracias!}
  branding:
    primary-color: ${BRANDING_PRIMARY_COLOR:#0E5C55}
    accent-color: ${BRANDING_ACCENT_COLOR:#D98A2B}
    font-family: ${BRANDING_FONT_FAMILY:Roboto}
    pwa-background-color: ${BRANDING_PWA_BACKGROUND_COLOR:#FFFFFF}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false}
    days-before-deadline: [15, 7, 1]
  cron:
    reminder: ${REMINDER_CRON:0 0 9 * * *}
    generador: ${GENERATOR_CRON:0 0 2 1 1 *}

integraciones:
  exigir-firma-webhook: ${INTEGRACIONES_EXIGIR_FIRMA_WEBHOOK:false}
  connect-timeout-ms: ${INTEGRACIONES_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${INTEGRACIONES_READ_TIMEOUT_MS:15000}
  reintentos:
    intervalo-ms: ${INTEGRACIONES_REINTENTOS_MS:60000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  send-default-pii: false
  exception-resolver-order: -2147483648

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false

logging:
  level:
    com.magnetixdian: INFO
    org.hibernate.SQL: WARN
