spring:
  application:
    name: magnetixdian-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/magnetixdian?characterEncoding=UTF-8}
    username: ${DB_USER:magnetixdian}
    password: ${DB_PASSWORD:magnetixdian}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    time-zone: America/Bogota
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

magnetixdian:
  jwt:
    secret: ${JWT_SECRET:bWFnbmV0aXhkaWFuLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLTIwMjYtcGt6ZDEyM2ZiYQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false}
    days-before-deadline: [15, 7, 1]
  cron:
    reminder: ${REMINDER_CRON:0 0 9 * * *}
    generador: ${GENERATOR_CRON:0 0 2 1 1 *}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false

logging:
  level:
    com.magnetixdian: INFO
    org.hibernate.SQL: WARN
