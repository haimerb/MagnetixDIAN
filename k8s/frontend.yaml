apiVersion: apps/v1
kind: Deployment
metadata:
  name: magnetixdian-frontend
  namespace: magnetixdian
  labels:
    app: magnetixdian-frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: magnetixdian-frontend }
  template:
    metadata:
      labels: { app: magnetixdian-frontend }
    spec:
      containers:
        - name: frontend
          image: magnetixdian/frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80, name: http }]
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: magnetixdian
spec:
  selector: { app: magnetixdian-frontend }
  ports:
    - port: 80
      targetPort: 80