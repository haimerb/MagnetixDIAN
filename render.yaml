# Blueprint de deploy en Render (free tier) — SOLO backend.
# Deploy alternativo e independiente del actual (docker-compose/GoDaddy):
#   frontend  → Cloudflare Pages (https://magnetixdian.pages.dev)
#   backend   → Render (este blueprint)                                        
#   base datos→ Supabase PostgreSQL
# Uso: en Render, New → Blueprint → sube este repo (o pega este archivo).
# Reemplaza DB_URL, CORS_ORIGINS y genera los secretos en el dashboard de Render.

services:
  - type: web
    name: magnetixdian-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile.render
    dockerContext: backend
    healthCheckPath: /actuator/health
    plan: free
    autoDeploy: false
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_USER
        value: postgres.bzkiibkvvmkghgeohugq
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CRYPTO_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://magnetixdian.pages.dev,https://magnetixdian.hbarbetti-ing.workers.dev
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: NOTIFICATIONS_ENABLED
        value: "false"
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://magnetixdian.hbarbetti-ing.workers.dev
      - key: AUTH_EXPOSE_TOKEN
        value: "false"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: WOMPI_CHECKOUT_URL
        value: https://checkout.wompi.co/p/
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_BASE_URL
        value: https://api.mercadopago.com
      - key: MERCADOPAGO_BACK_URL
        value: https://magnetixdian.hbarbetti-ing.workers.dev/app/suscripcion
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
